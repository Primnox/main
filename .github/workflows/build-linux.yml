name: Build Linux AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Linux Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev portaudio19-dev

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Backend
        run: |
          cd backend
          pyinstaller primnox_backend.spec --clean -y

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Prebuild Source Stripping
        run: |
          cd frontend
          npm run prebuild

      - name: Build Frontend (Vite)
        run: |
          cd frontend
          npx vite build

      - name: Package Linux AppImage
        run: |
          cd frontend
          npx electron-builder --linux AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primnox-Linux-AppImage
          path: frontend/dist-electron/*.AppImage
          retention-days: 7
