name: CI

# The only pre-existing workflow (build-windows.yml) runs on tags and only
# builds. This one runs the test suites on every push and PR, across all three
# platforms Primnox ships to.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Frontend: typecheck, unit tests, production build ────────────────────
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Production build
        working-directory: frontend
        run: npx vite build

      # Drives the built app headlessly with no backend running — the state
      # that surfaced the /api/dashboard request storm and the Google Fonts
      # call. Run on every platform: the renderer is where per-OS webview
      # differences show up, and a Linux-only run cannot see them.
      - name: Install Chromium for E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        working-directory: frontend
        run: npm run test:e2e

  # ── Tauri shell: build + test the Rust on every target platform ──────────
  # This is the only place macOS gets verified — the Objective-C in Tauri's
  # dependency tree cannot be cross-compiled from Linux.
  tauri:
    name: Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Formatting
        working-directory: frontend/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: frontend/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: frontend/src-tauri
        run: cargo test

      - name: Build
        working-directory: frontend/src-tauri
        run: cargo build

  # ── Windows installer: a runnable build you can actually click ───────────
  # CI proving the Rust compiles is not the same as the app working: the Linux
  # startup abort compiled and unit-tested perfectly while being fatal at
  # launch. This job produces a real NSIS installer, downloadable from the run's
  # Artifacts section, so the Windows shell can be exercised by hand.
  #
  # The Python backend is NOT bundled — that lives in tauri.bundle.conf.json and
  # needs a PyInstaller build first (see the tauri:build:full script). Launch the
  # backend separately with start.bat; without it the UI runs but shows
  # "Connection Lost", which is the correct behaviour, not a build failure.
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Runs tauri.conf.json's beforeBuildCommand (tsc + vite build) itself.
      - name: Build Tauri app
        working-directory: frontend
        run: npx tauri build

      - name: List bundle output
        working-directory: frontend
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe, *.msi | Select-Object FullName, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Primnox-Tauri-Windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  # ── Backend: Python unit tests ───────────────────────────────────────────
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        working-directory: backend
        # Deliberately not installing requirements.txt: it pulls torch and
        # transformers (multi-GB) for the PII model. requirements-test.txt is
        # the light subset the suite actually imports; the unit tests cover pure
        # logic and stub anything that needs those.
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Unit tests
        working-directory: backend
        run: python -m pytest -q
