name: Build macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # arm64 (Apple Silicon) — macos-14 is arm64 only

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install macOS System Dependencies
        run: |
          brew install zbar poppler libsndfile

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip uninstall typing -y || true

      - name: Build Python Backend
        run: |
          cd backend
          pyinstaller primnox_backend.spec --clean -y

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Prebuild Source Stripping
        run: |
          cd frontend
          npm run prebuild

      - name: Build Frontend (Vite)
        run: |
          cd frontend
          npx vite build

      - name: Package macOS DMG (arm64)
        run: |
          cd frontend
          npx electron-builder --mac dmg --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primnox-macOS-DMG
          path: frontend/dist-electron/*.dmg
          retention-days: 7
