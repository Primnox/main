name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    permissions:
      contents: write

    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '20'

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Extract version from tag ────────────────────────────────────────
      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $ver = $matches[1]
          } else {
            $ver = (Get-Content v2/frontend/package.json | ConvertFrom-Json).version
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=v$ver"    >> $env:GITHUB_OUTPUT
          echo "Building version: $ver"

      # ── Python setup + cache ────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: v2/backend/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          cd v2/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip uninstall typing -y 2>$null

      # ── Fetch PII model (Privacy Mirror) ────────────────────────────────
      - name: Fetch Privacy Mirror PII model
        shell: pwsh
        run: |
          cd v2/backend
          python fetch_pii_model.py

      # ── Build Python backend with PyInstaller ───────────────────────────
      - name: Build Python backend
        shell: pwsh
        run: |
          cd v2/backend
          pyinstaller primnox2_backend.spec --clean -y
          echo "Backend build output:"
          Get-ChildItem dist/primnox2_backend -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "  Total size: $([math]::Round($_.Sum/1MB, 1)) MB, $($_.Count) files" }

      # ── Node.js setup + cache ───────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          cd v2/frontend
          npm ci

      # ── Build frontend (Vite) ───────────────────────────────────────────
      # V1 had a "Pre-build source stripping" step here (npm run prebuild).
      # V2 has no equivalent script — nothing here strips anything from the
      # V2 frontend today, which is worth revisiting rather than silently
      # matching, if V1's step existed for a reason beyond bundle size.
      - name: Build frontend (Vite)
        shell: pwsh
        run: |
          cd v2/frontend
          npx tsc && npx vite build

      # ── Rust toolchain (Tauri) ──────────────────────────────────────────
      # Tauri compiles a real Rust binary, so this needs a toolchain. Cached
      # separately from npm — a cold cargo build of the dependency tree is
      # the slowest step in the job.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('v2/frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      # ── Package NSIS installer ──────────────────────────────────────────
      - name: Package Windows NSIS installer
        shell: pwsh
        run: |
          cd v2/frontend
          npx tauri build --config src-tauri/tauri.bundle.conf.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── List build artifacts ────────────────────────────────────────────
      - name: List build artifacts
        shell: pwsh
        run: |
          echo "=== Build output ==="
          Get-ChildItem v2/frontend/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            "$($_.Length / 1MB | ForEach-Object { '{0:N1} MB' -f $_ })  $($_.Name)"
          }

      # ── Upload installer as workflow artifact ───────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primnox-Setup-${{ steps.version.outputs.VERSION }}
          path: |
            v2/frontend/src-tauri/target/release/bundle/nsis/*.exe
            v2/frontend/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

      # ── Create GitHub Release on Primnox/public ─────────────────────────
      # Uses RELEASE_TOKEN (PAT with Contents:write on Primnox/public)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Primnox/public
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Primnox ${{ steps.version.outputs.TAG }}"
          draft: ${{ github.event.inputs.draft || 'false' }}
          prerelease: false
          generate_release_notes: true
          files: |
            v2/frontend/src-tauri/target/release/bundle/nsis/*.exe
            v2/frontend/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # ── Also publish to Cyanexani/primnox_extension (legacy) ────────────
      - name: Publish to legacy release repo
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Cyanexani/primnox_extension
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Primnox ${{ steps.version.outputs.TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            v2/frontend/src-tauri/target/release/bundle/nsis/*.exe
            v2/frontend/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
