name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # contents:write lets the workflow create releases. NOTE: this only covers
    # same-repo publishing. Releases here are published to Primnox/public (see
    # frontend/package.json "publish"), a DIFFERENT repo, so the publish step
    # below must use a PAT secret (RELEASE_TOKEN) with write access to that repo.
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip uninstall typing -y

      - name: Build Python Backend
        run: |
          cd backend
          pyinstaller primnox_backend.spec --clean -y

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Prebuild Source Stripping
        run: |
          cd frontend
          npm run prebuild

      - name: Build Frontend (Vite)
        run: |
          cd frontend
          npx vite build

      - name: Package Windows EXE and Publish
        run: |
          cd frontend
          npx electron-builder --win --publish always
        env:
          # Cross-repo release to Primnox/public requires a PAT with write
          # access to that repo. The default GITHUB_TOKEN cannot do this.
          # Create a fine-grained PAT (Contents: read & write on Primnox/public)
          # and add it as the RELEASE_TOKEN secret on the Primnox/main repo.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Primnox-Windows-EXE
          path: frontend/dist-electron/*.exe
          retention-days: 7
