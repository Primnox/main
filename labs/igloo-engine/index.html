<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>igloo-engine</title>
    <style>
      html {
        --bg: #a0a5b1;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: var(--bg); touch-action: none;
      }
      #app { position: absolute; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      .hud {
        position: absolute; left: 16px; bottom: 14px; z-index: 10;
        font: 11px/1.6 ui-monospace, "IBM Plex Mono", Menlo, monospace;
        color: #0d1b2a; opacity: .62; letter-spacing: .04em;
        text-transform: uppercase; pointer-events: none; white-space: pre;
      }
      .boot {
        position: absolute; inset: 0; z-index: 20; display: grid; place-items: center;
        background: var(--bg); transition: opacity .7s ease;
        font: 11px ui-monospace, Menlo, monospace; color: #0d1b2a; letter-spacing: .18em;
      }
      .boot.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud" id="hud"></div>
    <div class="boot" id="boot">LOADING</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
