<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        /* The Pill */
        #island {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            width: 150px;
            height: 35px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        height 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        background 0.3s ease;
            color: white;
            padding: 0 15px;
            box-sizing: border-box;
            cursor: default;
        }

        #island.active {
            width: 450px;
            height: auto;
            min-height: 120px;
            border-radius: 24px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.95);
        }

        /* Idle Content */
        #idle-content {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 35px;
            width: 100%;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        #island.active #idle-content {
            display: none;
            opacity: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #00ff88;
        }

        .primnox-name {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: lowercase;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Expanded Content */
        #active-content {
            display: none;
            opacity: 0;
            width: 100%;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.4s ease 0.2s; /* Delay fade-in until expansion almost done */
        }

        #island.active #active-content {
            display: flex;
            opacity: 1;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
            margin: 0;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            width: 100%;
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.2);
            cursor: pointer;
            transition: background 0.2s;
        }

        .chip:hover {
            background: rgba(0, 255, 136, 0.15);
        }

        .btn-copy {
            background: #fff;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-copy:active {
            transform: scale(0.95);
        }

        .btn-copy.success {
            background: #00ff88;
            color: #000;
        }

    </style>
</head>
<body>
    <div id="island">
        <!-- IDLE STATE -->
        <div id="idle-content">
            <div class="status-dot" id="status-dot"></div>
            <span class="primnox-name">primnox</span>
            <div id="idle-mic-icon" style="margin-left: 10px; display: flex; align-items: center; justify-content: center;"></div>
        </div>

        <!-- ACTIVE STATE -->
        <div id="active-content">
            <p class="message-text" id="msg">hey, i noticed you're stuck on that same error. need a hand?</p>
            <div class="controls">
                <div class="chips" id="chips">
                    <!-- <div class="chip">fix it</div> -->
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-copy" id="notes-btn" style="background: transparent; color: #b538ff; border: 1px solid rgba(181, 56, 255, 0.3);">notes</button>
                    <button class="btn-copy" id="active-mic-btn" style="background: transparent; color: #00F0FF; border: 1px solid rgba(0, 240, 255, 0.3);">mute mic</button>
                    <button class="btn-copy" id="copy-btn">copy</button>
                    <button class="btn-copy" id="clear-btn" style="background: #FF003C; color: white;">clear</button>
                </div>
            </div>
        </div>
    </div>

    <script src="island.js"></script>
</body>
</html>
