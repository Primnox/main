[package]
name = "primnox"
version = "1.2.0-beta"
description = "Primnox — a personal AI operating environment for your desktop"
authors = ["Primnox"]
license = "BUSL-1.1"
repository = "https://github.com/Primnox/main"
edition = "2021"
rust-version = "1.77"

# The app logic lives in a library so it can be unit-tested with `cargo test`.
# `main.rs` is a thin shim that calls into it.
[lib]
name = "primnox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP only — the sole caller talks to the backend on 127.0.0.1. The
# default features drag in rustls + ring, whose C build step needs an MSVC
# toolchain (`lib.exe`) and breaks `cargo check --target x86_64-pc-windows-msvc`
# on non-Windows hosts, for TLS this app never speaks.
ureq = { version = "2", default-features = false }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
