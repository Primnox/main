[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers -m "not live"
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: heavier/stress tests (concurrency, scale) — still run by default, just slower
    live: needs a REAL model call or a REAL sandbox execution (costs money / needs
        provider keys / needs the provisioned sandbox account). Excluded from the
        default run via addopts; opt in with `pytest -m live`.
